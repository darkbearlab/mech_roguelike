<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1013'/%3E%3Cpolygon points='4,2 12,2 16,8 12,14 4,14 0,8' fill='none' stroke='%234fd6ff' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <title>機體 Roguelike — 試驗場</title>
  </head>
  <body>
    <!-- 地圖是滿版底層；儀表與兩個觸控盤半透明浮在上面（§9）。 -->
    <div id="app">
      <canvas id="map"></canvas>

      <header id="hud">
        <div class="hud-top">
        <canvas id="dial" aria-label="姿態儀：機首是朝向，黃色箭頭是速度"></canvas>
        <div class="hud-grid">
          <div class="hud-line">
            <b id="hud-chassis"></b>
            <span id="hud-drive" class="dim"></span>
            <span id="hud-round" class="dim right"></span>
          </div>
          <div class="hud-line">
            <span id="hud-speed" class="big"></span>
            <span id="hud-facing"></span>
            <span id="hud-ammo" class="dim right"></span>
          </div>
          <div class="hud-line">
            <div id="hud-heat" class="heat">
              <div id="hud-heat-fill"></div>
              <div id="hud-heat-mark"></div>
              <span id="hud-heat-num"></span>
            </div>
            <div id="hud-ap"></div>
          </div>
        </div>
        <div class="hud-tools">
          <button id="btn-tune" type="button" title="調參">⚙</button>
          <button id="btn-recenter" type="button" class="hidden" title="鏡頭回到機體">◎</button>
        </div>
        </div>
        <!-- 跑道：下一個檢查點與這一步的提示（之後的新手教學就是這一行）。沒有跑道的地圖不顯示。 -->
        <div id="hud-course" class="course-bar hidden">
          <div class="course-text"><b id="course-step"></b> <span id="course-hint"></span></div>
          <button id="btn-course-restart" type="button" title="回到起點重跑">重跑</button>
        </div>
      </header>

      <footer id="controls">
        <div id="toast" class="toast" aria-live="polite"></div>
        <!-- 左盤：移動。3×2 六向 + 巡航 + 制動，佈局來自 ui.json 的 movePad。 -->
        <div id="move-pad" class="pad"></div>
        <!-- 右盤：功能盤＝座艙。佈局來自該機型座艙（ui.json 的 cockpits）。 -->
        <div id="func-pad" class="pad"></div>
      </footer>

      <section id="tune-panel" class="sheet hidden"></section>
    </div>

    <!-- 開機失敗的說明。樣式全部寫在行內：這個畫面出現時，style.css 多半也沒載入
         （CSS 是由 main.ts import 的）。遊戲一啟動，main.ts 就把它移除。 -->
    <div
      id="boot-fail"
      hidden
      style="position:fixed;inset:0;z-index:100;background:#0b0e12;color:#d9e2ea;padding:24px 20px;font:15px/1.7 system-ui,sans-serif;overflow:auto"
    >
      <b style="color:#ffb347;font-size:17px">遊戲沒有啟動</b>
      <p>
        最常見的原因：GitHub Pages 發布的是 repo 裡<b>未建置的原始碼</b>，而不是 CI 建置出來的版本。
      </p>
      <p>
        到 repo 的 <b>Settings → Pages → Build and deployment → Source</b>，選 <b>GitHub Actions</b>
        （不是 Deploy from a branch），再到 <b>Actions</b> 分頁把「Deploy to GitHub Pages」重跑一次。
      </p>
      <p style="color:#8a9bab;font-size:13px">本機開發請用 <code>npm run dev</code>，不要直接打開 index.html。</p>
    </div>
    <script>
      // 6 秒後遊戲還沒啟動就顯示上面的說明，而不是留一片空白。
      // 網路慢時可能先閃出來 —— 遊戲一啟動就會被移除，所以不會卡住。
      setTimeout(function () {
        var el = document.getElementById('boot-fail');
        if (el && !window.__game) el.hidden = false;
      }, 6000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
